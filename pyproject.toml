[project]
name = "status-page-multi-regiao"
version = "0.1.0"
description = "Health checks multi-regiao com status page agregada (FastAPI). Regioes simuladas localmente, sem rede real."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
status-page = "status_page_multi_regiao.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
